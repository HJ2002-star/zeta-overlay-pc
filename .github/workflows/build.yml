name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Secrets에 저장해둔 Firebase 웹 앱 설정값으로 firebase-config.js를 생성합니다.
      # (Settings > Secrets and variables > Actions 에서 아래 이름으로 등록)
      - name: Generate firebase-config.js from secrets
        run: |
          cat > src/firebase-config.js <<EOF
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
          };
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build (esbuild bundle)
        run: npm run build

      # 확장 프로그램 폴더 전체(빌드 결과 포함, node_modules 제외)를 zip으로 묶어서
      # Actions 실행 결과의 Artifacts에서 다운로드할 수 있게 올립니다.
      # (안드로이드 쪽 build.yml에서 app-debug.apk를 올리는 것과 같은 방식)
      - name: Package extension
        run: |
          zip -r zeta-overlay-pc.zip . \
            -x "node_modules/*" -x ".git/*" -x ".github/*"

      - uses: actions/upload-artifact@v4
        with:
          name: zeta-overlay-pc
          path: zeta-overlay-pc.zip

  deploy-rules:
    runs-on: ubuntu-latest
    # firestore.rules/storage.rules가 바뀐 push에서만 배포하고 싶다면 아래 if 조건의
    # paths 필터를 이 job에 추가하거나, on.push.paths로 워크플로 자체를 제한해도 됩니다.
    steps:
      - uses: actions/checkout@v4

      # Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > "새 비공개 키 생성"으로 받은
      # JSON 전체를 GitHub Secret(FIREBASE_SERVICE_ACCOUNT)에 통째로 저장해두세요.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Firestore & Storage rules
        run: |
          npx firebase-tools@latest deploy \
            --only firestore:rules,storage:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive